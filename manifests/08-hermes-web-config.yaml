---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-web
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: web-ui
data:
  hermes-web.py: |
    #!/usr/bin/env python3
    """
    Hermes Web UI — lightweight aiohttp server with login + chat proxy.
    Runs alongside the Hermes Agent gateway.
    """
    import asyncio, os, json, hashlib, hmac, time, base64
    import aiohttp
    from aiohttp import web

    WEB_PORT      = int(os.getenv("WEB_PORT", "8080"))
    HERMES_API    = os.getenv("HERMES_API", "http://127.0.0.1:8642")
    WEB_USERNAME  = os.getenv("WEB_USERNAME", "hanna")
    WEB_PASSWORD  = os.getenv("WEB_PASSWORD", "hanna123")
    SESSION_SECRET= os.getenv("SESSION_SECRET", "hermes-web-secret-change-me")

    def make_token(username: str) -> str:
        return base64.urlsafe_b64encode(
            hmac.new(
                SESSION_SECRET.encode(),
                username.encode(),
                hashlib.sha256
            ).digest()
        ).decode()[:32]

    def check_token(token: str):
        if not token or len(token) < 10:
            return None
        try:
            expected = make_token(WEB_USERNAME)
            if hmac.compare_digest(token, expected):
                return WEB_USERNAME
        except Exception:
            pass
        return None

    HTML = """<!DOCTYPE html>
    <html lang="pt-BR">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanna — Assistente do Condomínio</title>
    <style>
      :root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--accent:#3b82f6;--accent-hover:#2563eb;--border:#334155;--success:#22c55e;--danger:#ef4444;}
      *{margin:0;padding:0;box-sizing:border-box;}
      body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
      .hidden{display:none!important}
      .login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
      .login-card{background:var(--card);border-radius:1rem;padding:2.5rem;width:100%;max-width:400px;border:1px solid var(--border)}
      .login-card h1{font-size:1.5rem;margin-bottom:.25rem}
      .login-card p{color:var(--muted);margin-bottom:1.5rem;font-size:.9rem}
      .login-card label{display:block;margin-bottom:.25rem;font-size:.85rem;color:var(--muted)}
      .login-card input{width:100%;padding:.75rem;border-radius:.5rem;border:1px solid var(--border);background:var(--bg);color:var(--text);margin-bottom:1rem;font-size:.95rem}
      .login-card input:focus{outline:none;border-color:var(--accent)}
      .login-card button{width:100%;padding:.75rem;border-radius:.5rem;border:none;background:var(--accent);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s}
      .login-card button:hover{background:var(--accent-hover)}
      .login-error{color:var(--danger);font-size:.85rem;margin-top:.5rem}
      .app{display:flex;height:100vh}
      .sidebar{width:260px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
      .sidebar-header{padding:1.25rem;border-bottom:1px solid var(--border)}
      .sidebar-header h2{font-size:1.1rem;font-weight:700}
      .sidebar-header span{font-size:.75rem;color:var(--muted)}
      .sidebar-nav{flex:1;padding:.5rem;overflow-y:auto}
      .sidebar-nav a{display:flex;align-items:center;gap:.5rem;padding:.65rem .75rem;border-radius:.5rem;color:var(--text);text-decoration:none;font-size:.9rem;transition:background .2s;cursor:pointer}
      .sidebar-nav a:hover,.sidebar-nav a.active{background:var(--bg)}
      .sidebar-nav a .icon{font-size:1.1rem;width:1.5rem;text-align:center}
      .sidebar-footer{padding:.75rem 1rem;border-top:1px solid var(--border);font-size:.8rem;color:var(--muted)}
      .sidebar-footer button{width:100%;padding:.5rem;border-radius:.5rem;border:1px solid var(--border);background:transparent;color:var(--danger);cursor:pointer;font-size:.85rem;margin-top:.5rem}
      .main{flex:1;display:flex;flex-direction:column;min-width:0}
      .chat-container{flex:1;display:flex;flex-direction:column}
      .chat-messages{flex:1;overflow-y:auto;padding:1.5rem}
      .message{margin-bottom:1.25rem;display:flex;gap:.75rem}
      .message.user{flex-direction:row-reverse}
      .message .avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0;font-weight:700}
      .message.user .avatar{background:var(--accent);color:#fff}
      .message.assistant .avatar{background:var(--success);color:#fff}
      .message .bubble{max-width:75%;padding:.75rem 1rem;border-radius:1rem;line-height:1.5;font-size:.9rem;white-space:pre-wrap;word-break:break-word}
      .message.user .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:.25rem}
      .message.assistant .bubble{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:.25rem}
      .chat-input-area{padding:1rem 1.5rem;border-top:1px solid var(--border)}
      .chat-input-wrap{display:flex;gap:.5rem;background:var(--card);border-radius:.75rem;padding:.5rem;border:1px solid var(--border)}
      .chat-input-wrap textarea{flex:1;background:transparent;border:none;color:var(--text);padding:.5rem;resize:none;font-size:.9rem;font-family:inherit;min-height:24px;max-height:120px}
      .chat-input-wrap textarea:focus{outline:none}
      .chat-input-wrap button{width:40px;height:40px;border-radius:.5rem;border:none;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;transition:background .2s}
      .chat-input-wrap button:hover{background:var(--accent-hover)}
      .chat-input-wrap button:disabled{opacity:.5;cursor:not-allowed}
      .guide-page{padding:2rem;overflow-y:auto;max-width:800px}
      .guide-page h1{font-size:1.5rem;margin-bottom:1rem}
      .guide-page h2{font-size:1.2rem;margin:1.5rem 0 .75rem;color:var(--accent)}
      .guide-page p{margin-bottom:.75rem;line-height:1.6}
      .guide-page code{background:var(--card);padding:.2rem .4rem;border-radius:.25rem;font-size:.9em;border:1px solid var(--border)}
      .guide-page pre{background:var(--card);padding:1rem;border-radius:.5rem;overflow-x:auto;margin:.75rem 0;border:1px solid var(--border);font-size:.85rem}
      .guide-page .step{margin-bottom:.5rem;padding:.75rem;background:var(--card);border-radius:.5rem;border-left:3px solid var(--accent)}
      @media(max-width:768px){.sidebar{display:none}.sidebar.open{display:flex;position:fixed;inset:0;z-index:10;width:100%}.message .bubble{max-width:90%}}
    </style>
    </head>
    <body>
    <div id="loginPage" class="login-page">
      <div class="login-card">
        <h1>🏰 Hanna</h1>
        <p>Assistente do Condomínio — Morador Online</p>
        <label for="username">Usuário</label>
        <input type="text" id="username" placeholder="hanna" autocomplete="username">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="..." autocomplete="current-password">
        <button onclick="login()">Entrar</button>
        <div id="loginError" class="login-error hidden"></div>
      </div>
    </div>
    <div id="app" class="app hidden">
      <div class="sidebar" id="sidebar">
        <div class="sidebar-header"><h2>🏰 Hanna</h2><span>• Online</span></div>
        <div class="sidebar-nav">
          <a class="active" onclick="showPage('chat')"><span class="icon">💬</span> Chat</a>
          <a onclick="showPage('guide')"><span class="icon">📖</span> Integrações</a>
          <a onclick="showPage('about')"><span class="icon">ℹ️</span> Sobre</a>
        </div>
        <div class="sidebar-footer"><div id="userDisplay">👤 hanna</div><button onclick="logout()">Sair</button></div>
      </div>
      <div class="main">
        <div id="pageChat" class="chat-container">
          <div class="chat-messages" id="chatMessages">
            <div class="message assistant"><div class="avatar">H</div><div class="bubble">Olá! Sou a Hanna, assistente do condomínio. Como posso ajudar?</div></div>
          </div>
          <div class="chat-input-area">
            <div class="chat-input-wrap">
              <textarea id="chatInput" placeholder="Digite sua mensagem..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
              <button id="sendBtn" onclick="sendMsg()">➤</button>
            </div>
          </div>
        </div>
        <div id="pageGuide" class="guide-page hidden">
          <h1>📖 Integrações</h1>
          <p>Conecte a Hanna aos canais do seu condomínio.</p>
          <h2>🤖 Telegram</h2>
          <div class="step">1. Crie um bot no @BotFather e obtenha o token</div>
          <div class="step">2. Configure a env var TELEGRAM_BOT_TOKEN</div>
          <div class="step">3. Reinicie o gateway</div>
          <h2>💬 Discord</h2>
          <div class="step">1. Crie um app no Discord Developer Portal</div>
          <div class="step">2. Gere um token de bot e adicione ao servidor</div>
          <div class="step">3. Configure a env var DISCORD_BOT_TOKEN</div>
          <h2>🔗 API OpenAI-compatível</h2>
          <pre>Endpoint: https://hermes-agent-hermes.apps.cluster1.sandbox1992.opentlc.com/v1
    API Key: sua API_SERVER_KEY</pre>
        </div>
        <div id="pageAbout" class="guide-page hidden">
          <h1>ℹ️ Sobre a Hanna</h1>
          <p><strong>Hanna</strong> é a assistente inteligente do <strong>Morador Online</strong>.</p>
          <h2>🔧 Stack</h2>
          <ul><li><strong>Backend:</strong> Hermes Agent + DeepSeek</li><li><strong>Infra:</strong> OpenShift</li><li><strong>Modelo:</strong> DeepSeek V4 Flash</li></ul>
        </div>
      </div>
    </div>
    <script>
    const API_BASE='';let token=localStorage.getItem('hermes_token');
    async function login(){const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value;if(!u||!p){document.getElementById('loginError').textContent='Preencha usuário e senha';document.getElementById('loginError').classList.remove('hidden');return}try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});const d=await r.json();if(r.ok){token=d.token;localStorage.setItem('hermes_token',token);document.getElementById('loginPage').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('userDisplay').textContent='👤 '+u}else{document.getElementById('loginError').textContent=d.error||'Login inválido';document.getElementById('loginError').classList.remove('hidden')}}catch(e){document.getElementById('loginError').textContent='Erro: '+e.message;document.getElementById('loginError').classList.remove('hidden')}}
    function logout(){token=null;localStorage.removeItem('hermes_token');document.getElementById('app').classList.add('hidden');document.getElementById('loginPage').classList.remove('hidden')}
    async function checkAuth(){if(!token)return false;try{const r=await fetch('/api/check',{headers:{'Authorization':'Bearer '+token}});return r.ok}catch{return false}}
    function showPage(n){document.querySelectorAll('.main>div').forEach(d=>d.classList.add('hidden'));document.getElementById('page'+n.charAt(0).toUpperCase()+n.slice(1)).classList.remove('hidden');document.querySelectorAll('.sidebar-nav a').forEach(a=>a.classList.remove('active'));document.querySelectorAll('.sidebar-nav a').forEach(a=>{if(a.textContent.trim().toLowerCase().includes(n))a.classList.add('active')});if(n==='chat')setTimeout(()=>document.getElementById('chatInput')?.focus(),100)}
    async function sendMsg(){const inp=document.getElementById('chatInput'),txt=inp.value.trim();if(!txt)return;inp.value='';document.getElementById('sendBtn').disabled=true;const c=document.getElementById('chatMessages');const m=document.createElement('div');m.className='message user';m.innerHTML='<div class=\"avatar\">U</div><div class=\"bubble\">'+txt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';c.appendChild(m);const t=document.createElement('div');t.className='message assistant typing';t.innerHTML='<div class=\"avatar\">H</div><div class=\"bubble\"></div>';c.appendChild(t);c.scrollTop=c.scrollHeight;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({message:txt})});t.remove();if(!r.ok){const e=await r.json().catch(()=>({}));const f=document.createElement('div');f.className='message assistant';f.innerHTML='<div class=\"avatar\">H</div><div class=\"bubble\">Erro: '+(e.error||r.statusText)+'</div>';c.appendChild(f);c.scrollTop=c.scrollHeight;document.getElementById('sendBtn').disabled=false;return}const d=await r.json();const rep=d.choices?.[0]?.message?.content||'(sem resposta)';const f=document.createElement('div');f.className='message assistant';f.innerHTML='<div class=\"avatar\">H</div><div class=\"bubble\">'+rep.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')+'</div>';c.appendChild(f)}catch(e){t.remove();const f=document.createElement('div');f.className='message assistant';f.innerHTML='<div class=\"avatar\">H</div><div class=\"bubble\">Erro de conexao: '+e.message+'</div>';c.appendChild(f)}c.scrollTop=c.scrollHeight;document.getElementById('sendBtn').disabled=false}
    (async()=>{if(token&&await checkAuth()){document.getElementById('loginPage').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}})();
    </script>
    </body>
    </html>"""

    async def handle_index(request):
        return web.Response(text=HTML, content_type="text/html")

    async def handle_login(request):
        try:
            body = await request.json()
            u, p = body.get("username","").strip(), body.get("password","").strip()
            if hmac.compare_digest(u, WEB_USERNAME) and hmac.compare_digest(p, WEB_PASSWORD):
                return web.json_response({"token": make_token(u), "user": u})
            return web.json_response({"error": "Usuário ou senha inválidos"}, status=401)
        except Exception:
            return web.json_response({"error": "Requisição inválida"}, status=400)

    async def handle_check(request):
        auth = request.headers.get("Authorization", "")
        tok = auth.replace("Bearer ","") if auth.startswith("Bearer ") else ""
        if check_token(tok):
            return web.json_response({"ok": True})
        return web.json_response({"ok": False}, status=401)

    async def handle_chat(request):
        auth = request.headers.get("Authorization", "")
        tok = auth.replace("Bearer ","") if auth.startswith("Bearer ") else ""
        if not check_token(tok):
            return web.json_response({"error": "Não autorizado"}, status=401)
        api_key = os.getenv("API_SERVER_KEY", "")
        headers = {"Authorization": f"Bearer {api_key}"} if api_key else {}
        try:
            body = await request.json()
            msg = body.get("message","").strip()
            if not msg:
                return web.json_response({"error": "Mensagem vazia"}, status=400)
            msgs = body.get("messages") or [{"role":"user","content":msg}]
            async with aiohttp.ClientSession() as session:
                async with session.post(f"{HERMES_API}/v1/chat/completions",
                    json={"model":"deepseek-chat","messages":msgs},
                    headers=headers,
                    timeout=aiohttp.ClientTimeout(total=120)) as resp:
                    if resp.status == 200:
                        return web.json_response(await resp.json())
                    err = await resp.text()
                    return web.json_response({"error": f"Hermes API error: {resp.status}"}, status=502)
        except asyncio.TimeoutError:
            return web.json_response({"error": "Timeout"}, status=504)
        except Exception as e:
            return web.json_response({"error": str(e)}, status=500)

    async def main():
        app = web.Application()
        app.router.add_get("/", handle_index)
        app.router.add_post("/api/login", handle_login)
        app.router.add_get("/api/check", handle_check)
        app.router.add_post("/api/chat", handle_chat)
        runner = web.AppRunner(app)
        await runner.setup()
        site = web.TCPSite(runner, "0.0.0.0", WEB_PORT)
        await site.start()
        print(f"[Hermes Web] UI rodando em http://0.0.0.0:{WEB_PORT}")
        await asyncio.Event().wait()

    if __name__ == "__main__":
        asyncio.run(main())
