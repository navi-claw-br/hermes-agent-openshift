---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agent
        app.kubernetes.io/component: agent
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hermes
          # Custom UBI 9 image built for OpenShift compatibility.
          # Build: podman build -f Dockerfile.ubi -t ghcr.io/navi-claw-br/hermes-agent:latest .
          image: ghcr.io/navi-claw-br/hermes-agent:latest
          imagePullPolicy: IfNotPresent
          command:
            - /opt/hermes/venv/bin/python
            - -m
            - hermes_cli.main
          args:
            - gateway
          envFrom:
            - configMapRef:
                name: hermes-config
          env:
            # LLM API key — set via Secret for production
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: OPENAI_API_KEY
                  optional: true
          ports:
            - containerPort: 8642
              protocol: TCP
              name: http-api
            - containerPort: 8080
              protocol: TCP
              name: http-gateway
          volumeMounts:
            - name: data
              mountPath: /opt/data
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8642
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8642
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
