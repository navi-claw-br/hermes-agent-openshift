---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agent
        app.kubernetes.io/component: agent
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hermes
          image: ghcr.io/navi-claw-br/hermes-agent:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "[start] Hermes Agent gateway em background..."
              /opt/hermes/venv/bin/python -m hermes_cli.main gateway &
              echo "[start] Aguardando Hermes API em 8642..."
              for i in $(seq 1 30); do
                if curl -sf http://127.0.0.1:8642/health > /dev/null 2>&1; then
                  echo "[start] Hermes API pronto!"
                  break
                fi
                sleep 2
              done
              echo "[start] Iniciando Web UI Hanna na porta 8080..."
              exec /opt/hermes/venv/bin/python /opt/hermes-web/hermes-web.py
          envFrom:
            - configMapRef:
                name: hermes-config
          env:
            - name: HOME
              value: /opt/data
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: WEB_USERNAME
              value: "hanna"
            - name: WEB_PASSWORD
              value: "hanna123"
            - name: CONDOMINIO
              value: ""
            - name: MCP_ADMIN_URL
              value: "https://mcp-server-mo-admin.mo.app.br/mcp"
          ports:
            - containerPort: 8642
              protocol: TCP
              name: http-api
            - containerPort: 8080
              protocol: TCP
              name: http-web
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: web-ui
              mountPath: /opt/hermes-web
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: web-ui
          configMap:
            name: hermes-web
