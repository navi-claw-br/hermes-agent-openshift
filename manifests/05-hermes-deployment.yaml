---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agent
        app.kubernetes.io/component: agent
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hermes
          image: ghcr.io/navi-claw-br/hermes-agent:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              if [ -n "$OPENAI_API_KEY" ] || [ -n "$MCP_ADMIN_URL" ]; then
                /opt/hermes/venv/bin/python - <<'PY'
              import os, re, yaml

              path = "/opt/data/config.yaml"
              api_key = os.environ.get("OPENAI_API_KEY", "")
              mcp_admin_url = os.environ.get("MCP_ADMIN_URL", "").strip()
              if os.path.exists(path):
                  with open(path, "r", encoding="utf-8") as f:
                      config = f.read()
              else:
                  config = ""
              if api_key:
                  if re.search(r"^\s*api_key:\s*.*$", config, re.M):
                      config = re.sub(r"^(\s*api_key:\s*).*$", r"\1" + api_key, config, flags=re.M)
                  elif config.strip():
                      config = config.rstrip() + "\n  api_key: " + api_key + "\n"
                  else:
                      config = "model:\n  api_key: " + api_key + "\n"
              data = yaml.safe_load(config) or {}
              if mcp_admin_url:
                  data.setdefault("mcp_servers", {})["mo-admin"] = {
                      "url": mcp_admin_url,
                      "enabled": True,
                  }
                  with open(path, "w", encoding="utf-8") as f:
                      yaml.safe_dump(data, f, allow_unicode=True, sort_keys=False)
                  print("[start] Hermes MCP mo-admin sincronizado com MCP_ADMIN_URL")
              elif api_key:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(config)
                  print("[start] Hermes config api_key sincronizada com OPENAI_API_KEY")
              PY
              fi
              echo "[start] Hermes Agent gateway em background..."
              /opt/hermes/venv/bin/python -m hermes_cli.main gateway &
              echo "[start] Aguardando Hermes API em 8642..."
              for i in $(seq 1 30); do
                if curl -sf http://127.0.0.1:8642/health > /dev/null 2>&1; then
                  echo "[start] Hermes API pronto!"
                  break
                fi
                sleep 2
              done
              echo "[start] Iniciando Web UI Hanna na porta 8080..."
              exec /opt/hermes/venv/bin/python /opt/hermes-web/hermes-web.py
          envFrom:
            - configMapRef:
                name: hermes-config
          env:
            - name: HOME
              value: /opt/data
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: WEB_USERNAME
              value: "hanna"
            - name: WEB_PASSWORD
              value: "hanna123"
            - name: CONDOMINIO
              value: ""
            - name: MCP_ADMIN_URL
              value: "https://mcp-server-mo-admin.mo.app.br/mcp"
          ports:
            - containerPort: 8642
              protocol: TCP
              name: http-api
            - containerPort: 8080
              protocol: TCP
              name: http-web
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: web-ui
              mountPath: /opt/hermes-web
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: web-ui
          configMap:
            name: hermes-web
