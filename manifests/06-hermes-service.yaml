---
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  ports:
    - name: http-web
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: http-api
      port: 8642
      targetPort: 8642
      protocol: TCP
  selector:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: agent
