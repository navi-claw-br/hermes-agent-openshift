---
# Template: copie para 04-hermes-secrets.yaml e preencha a API key
# Atenção: NÃO versionar 04-hermes-secrets.yaml — ele está em .gitignore
apiVersion: v1
kind: Secret
metadata:
  name: hermes-secrets
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # OPENAI_API_KEY é a env var lida pelo Hermes Agent.
  # Funciona com qualquer API key de provedor OpenAI-compatível:
  #   DeepSeek:  sk-...
  #   OpenAI:    sk-...
  #   Groq:      gsk_...
  OPENAI_API_KEY: "coloque-sua-api-key-aqui"
