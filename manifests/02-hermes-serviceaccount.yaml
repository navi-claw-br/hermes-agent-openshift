---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-agent
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: serviceaccount
---
# Hermes Agent uses s6-overlay as PID 1, which requires root during
# bootstrap before dropping privileges to the internal `hermes` user.
# The `anyuid` SCC allows the container to run with the Dockerfile's
# default root user, which s6-overlay expects.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-agent-anyuid
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: hermes-agent
    namespace: hermes
